name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Build
        run: npx turbo build

      - name: Lint
        run: npx turbo lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npx turbo test

  desktop-changes:
    name: Detect Desktop Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        run: |
          changed=false
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | grep -E '^(apps/desktop/|apps/frontend/public/favicons/|scripts/sync-desktop-release-version\.mjs|package(-lock)?\.json|\.github/workflows/(ci|desktop|release)\.yml)$'; then
            changed=true
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

  desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: desktop-changes
    if: needs.desktop-changes.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
            artifact_path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            args: ''
            artifact_path: apps/desktop/src-tauri/target/release/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Sync desktop test version
        run: node scripts/sync-desktop-release-version.mjs 0.0.1

      - name: Generate desktop icons
        working-directory: apps/desktop
        run: npx tauri icon ../frontend/public/favicons/apple-touch-icon.png --output src-tauri/icons

      - name: Build unsigned Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: placet-desktop-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
