name: Desktop

on:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - '.github/workflows/release.yml'
      - 'apps/desktop/**'
      - 'apps/frontend/public/favicons/**'
      - 'scripts/sync-desktop-release-version.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version to build'
        required: false
        default: '0.0.0-test'

permissions:
  contents: read

jobs:
  desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
            artifact_path: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            args: ''
            artifact_path: apps/desktop/src-tauri/target/release/bundle
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            args: ''
            artifact_path: apps/desktop/src-tauri/target/release/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Sync desktop test version
        run: node scripts/sync-desktop-release-version.mjs "${{ github.event.inputs.version || '0.0.0-test' }}"

      - name: Generate desktop icons
        working-directory: apps/desktop
        run: npx tauri icon ../frontend/public/favicons/apple-touch-icon.png --output src-tauri/icons

      - name: Build unsigned Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: placet-desktop-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
