daemon off;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  # ── Security headers ──────────────────────────────────────────────────────
  server_tokens off;

  # Temp paths for non-root operation
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  access_log /dev/stdout combined;

  # ── Upstream services ─────────────────────────────────────────────────────
  upstream frontend {
    server 127.0.0.1:3000;
  }

  upstream backend {
    server 127.0.0.1:3001;
  }

  upstream mcp {
    server 127.0.0.1:3002;
  }

  server {
    listen 8080;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "SAMEORIGIN"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── MCP server (/mcp) ──────────────────────────────────────────────────
    location /mcp {
      proxy_pass http://mcp;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # SSE support
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }

    # ── MCP health ──────────────────────────────────────────────────────────
    location = /mcp/health {
      proxy_pass http://mcp/health;
      proxy_set_header Host $host;
    }

    # ── WebSocket (/ws) — direct to backend ─────────────────────────────────
    location /ws {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
    }

    # ── Backend API health (used by Docker HEALTHCHECK) ─────────────────────
    location = /health {
      proxy_pass http://backend/health;
      proxy_set_header Host $host;
    }

    # ── Everything else → Frontend ──────────────────────────────────────────
    # Next.js middleware proxies /api/* to backend internally
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Support HMR / Next.js dev features via WebSocket
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # Required for WebSocket upgrade mapping
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
}
