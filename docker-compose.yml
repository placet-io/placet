services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-humanproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-humanproxy}
      POSTGRES_DB: ${POSTGRES_DB:-humanproxy}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-humanproxy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-humanproxy}:${POSTGRES_PASSWORD:-humanproxy}@postgres:5432/${POSTGRES_DB:-humanproxy}
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-humanproxy}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-admin@humanproxy.local}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-changeme}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        INTERNAL_API_URL: http://backend:${BACKEND_PORT:-3001}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: http://backend:${BACKEND_PORT:-3001}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
