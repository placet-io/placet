# ─────────────────────────────────────────────────────────────────────────────
# Placet — All-in-One Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Single-container deployment behind a single port (8080).
# All traffic (frontend, API, WebSocket, MCP) is routed through nginx.
#
# Configuration: create a .env file next to this file, or set env vars.
#
# SQLite (fully self-contained — no external dependencies):
#   docker compose -f docker-compose.aio.yml up -d --build
#
# PostgreSQL (requires an external PostgreSQL instance):
#   DB_PROVIDER=postgresql DATABASE_URL=postgres://... docker compose -f docker-compose.aio.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  placet:
    container_name: placet
    build:
      context: .
      dockerfile: Dockerfile.aio
    restart: unless-stopped
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      DB_PROVIDER: ${DB_PROVIDER:-sqlite}

      # ── Backend ───────────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET:-}
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-admin@placet.local}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-changeme}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@placet.local}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      ALLOW_PLUGIN_LOCAL_FETCH: ${ALLOW_PLUGIN_LOCAL_FETCH:-false}

      # ── MinIO (embedded) ──────────────────────────────────────────────────
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-placet}

      # ── Frontend ──────────────────────────────────────────────────────────
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}

      # ── MCP Server ───────────────────────────────────────────────────────
      MCP_CONNECTION_TIMEOUT_MS: ${MCP_CONNECTION_TIMEOUT_MS:-300000}
      PLACET_DEFAULT_CHANNEL: ${PLACET_DEFAULT_CHANNEL:-}
    ports:
      - '${PORT:-8080}:8080'
    volumes:
      - placet-data:/data
    # ── Security hardening ────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    tmpfs:
      - /tmp:size=256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const h=require('http');h.get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  placet-data:
