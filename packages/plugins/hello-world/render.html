<div id="plugin-root" class="p-4 rounded-lg border border-zinc-200 dark:border-zinc-700 bg-gradient-to-br from-lime-50 to-emerald-50 dark:from-lime-950/30 dark:to-emerald-950/30">
  <div class="flex items-center gap-3">
    <span id="emoji" class="text-3xl">👋</span>
    <div>
      <p class="font-semibold text-zinc-900 dark:text-zinc-100">
        Hello, <span id="name"></span>!
      </p>
      <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">
        Rendered by the <code class="px-1 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-[10px]">hello-world</code> plugin
      </p>
    </div>
  </div>
</div>

<script>
  const data = window.__PLUGIN_DATA__;

  document.getElementById('name').textContent = data.name || 'World';

  if (data.emoji) {
    document.getElementById('emoji').textContent = data.emoji;
  }

  HumanProxy.resize();
</script>
