<div id="plugin-root" class="p-4 rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900">
  <div id="loading" class="flex items-center gap-2 text-sm text-zinc-500">
    <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
    Loading product...
  </div>

  <div id="error" class="hidden text-sm text-red-500"></div>

  <div id="product" class="hidden">
    <div class="flex items-center gap-4">
      <div id="product-avatar" class="w-14 h-14 rounded-lg bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-xl font-bold text-zinc-400 overflow-hidden">
        <img id="product-image" class="w-full h-full object-cover hidden" />
        <span id="product-initials"></span>
      </div>
      <div class="flex-1 min-w-0">
        <h3 id="product-name" class="font-semibold text-zinc-900 dark:text-zinc-100 truncate"></h3>
        <p id="product-sku" class="text-xs text-zinc-400 font-mono"></p>
      </div>
      <div id="product-price" class="text-lg font-bold text-zinc-900 dark:text-zinc-100"></div>
    </div>
    <p id="product-desc" class="mt-3 text-sm text-zinc-600 dark:text-zinc-400 line-clamp-3"></p>
    <div id="product-tags" class="mt-3 flex flex-wrap gap-1.5"></div>
  </div>
</div>

<script>
  const data = window.__PLUGIN_DATA__;

  async function init() {
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const productEl = document.getElementById('product');

    try {
      const baseUrl = data.apiBaseUrl || '';
      if (!baseUrl) {
        // Demo mode: show product ID as a card without fetching
        showDemoProduct(data.productId);
        return;
      }

      const res = await HumanProxy.fetch(`${baseUrl}/products/${data.productId}`);
      const product = JSON.parse(res.body);

      showProduct(product);
    } catch (err) {
      // Fallback to demo mode on any error
      showDemoProduct(data.productId);
    }
  }

  function showProduct(product) {
    document.getElementById('loading').classList.add('hidden');

    const name = product.name || product.title || `Product ${data.productId}`;
    document.getElementById('product-name').textContent = name;
    document.getElementById('product-initials').textContent = name.charAt(0).toUpperCase();

    if (product.imageUrl || product.image) {
      const img = document.getElementById('product-image');
      img.src = product.imageUrl || product.image;
      img.classList.remove('hidden');
      document.getElementById('product-initials').classList.add('hidden');
    }

    if (product.sku || product.id) {
      document.getElementById('product-sku').textContent = `SKU: ${product.sku || product.id}`;
    }

    if (product.price !== undefined) {
      const price = typeof product.price === 'number'
        ? `$${product.price.toFixed(2)}`
        : product.price;
      document.getElementById('product-price').textContent = price;
    }

    if (product.description) {
      document.getElementById('product-desc').textContent = product.description;
    }

    if (product.tags && Array.isArray(product.tags)) {
      const container = document.getElementById('product-tags');
      product.tags.forEach(tag => {
        const el = document.createElement('span');
        el.className = 'px-2 py-0.5 text-xs rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400';
        el.textContent = tag;
        container.appendChild(el);
      });
    }

    document.getElementById('product').classList.remove('hidden');
    HumanProxy.resize();
  }

  function showDemoProduct(productId) {
    showProduct({
      name: `Product ${productId}`,
      id: productId,
      description: 'Product details would be fetched from the configured CRM API.',
      tags: ['demo']
    });
  }

  init();
</script>
